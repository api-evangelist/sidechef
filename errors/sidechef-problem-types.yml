rfc9457_note: >-
  Responses are application/json, not application/problem+json, and carry no type, title,
  detail, status or instance members. The envelope is the Django REST Framework default
  shape wrapped with an explicit status_code.
envelope:
  content_type: application/json
  fields:
  - name: status_code
    type: integer
    description: Duplicates the HTTP status code in the body.
  - name: error
    type: string | object
    description: >-
      A human-readable message on transport-level failures. The widget bundle also handles
      an object form (it reads Object.values(error.error) when error.error is an object),
      indicating field-level validation errors are returned as a keyed map.
  example: '{"status_code":401,"error":"Authentication credentials were not provided."}'
  success_envelope:
    fields: [success, data, error]
    description: >-
      The widget bundle branches on a top-level boolean `success`, reading `data` on
      success and `error` on failure.
