x-api-base-note: >-
  repair-api-bases.py reports `disagreement` because the two API entries name two different
  registrable hosts. This is correct and deliberate, not a defect: the v3 REST surface is
  served from SideChef's primary domain (www.sidechef.com/v3/, confirmed by a live 401 JSON
  response), while the Shoppable Button bundle is served from www.scgrocery.net, SideChef's
  own widget-delivery domain named as the loader host in SideChef's published integration
  documentation. Both bases were read from SideChef's own docs and probes; neither was
  guessed from a domain.
