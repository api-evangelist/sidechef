aid: sidechef
name: SideChef
description: >-
  SideChef is a food-technology company that licenses recipe content, shoppable-commerce
  and recipe-AI infrastructure to food brands, grocery retailers, food media publishers and
  kitchen-appliance makers. Its consumer cooking platform doubles as a B2B platform whose
  partner-facing surface is delivered three ways: embeddable JavaScript components (the
  Shoppable Recipe Button, Recipe Recommendation Row, RecipeAdapt personalization widget
  and an on-site recipe chat), a hosted Recipe Management System, and partner APIs such as
  the Recipe Recommendation API and RecipeAdapt. The underlying v3 REST surface is live at
  www.sidechef.com and the widget-delivery host www.scgrocery.net, but it is authenticated
  per partner and SideChef publishes no OpenAPI, developer portal or public API reference;
  the only public technical documentation is the Shoppable Button integration guide, and
  API access runs through a contact-sales motion.
