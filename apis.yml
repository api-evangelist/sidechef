apis:
- aid: sidechef:widget-api
  name: SideChef Widget API (v3)
  description: >-
    The live REST surface behind SideChef's embeddable partner widgets. Observed endpoints
    include /v3/widget/recipes/ (shoppable recipe lookup and cart hand-off) and
    /v3/widget/events/ (widget telemetry). Every request is authenticated per partner; an
    unauthenticated call returns HTTP 401 with a JSON error envelope. SideChef publishes no
    OpenAPI, no public reference and no developer portal for this surface.
  humanURL: https://business.sidechef.com/sb-documentation
  baseURL: https://www.sidechef.com/v3/
  tags:
  - Recipes
  - Commerce
  - Grocery
  properties:
  - type: Authentication
    url: authentication/sidechef-authentication.yml
  - type: ErrorCatalog
    url: errors/sidechef-problem-types.yml
  - type: Conventions
    url: conventions/sidechef-conventions.yml
- aid: sidechef:shoppable-button
  name: SideChef Shoppable Button
  description: >-
    A partner-embeddable JavaScript component that turns a recipe ingredient list on a
    partner site into a multi-retailer add-to-cart experience (Walmart, Target, Amazon
    Fresh, Instacart). Integration is declarative via data-* attributes on a host element,
    themed with CSS custom properties, and instrumented with a postMessage event stream.
    Version 2 is current; version 1 was deprecated on 2025-12-24.
  humanURL: https://business.sidechef.com/sb-documentation
  baseURL: https://www.scgrocery.net/widget/v2/
  tags:
  - Widgets
  - Commerce
  - Grocery
  properties:
  - type: Components
    url: components/sidechef-components.yml
  - type: Lifecycle
    url: lifecycle/sidechef-lifecycle.yml
