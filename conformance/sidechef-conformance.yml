generated: '2026-08-27'
method: probed
source: >-
  Live probe of a published SideChef recipe page plus the Shoppable Button documentation.
note: >-
  Reward-only. Entries marked conforms:false record a standard that was checked and not
  found; they are not a penalty and several are simply not applicable to a provider with no
  public REST contract.
standards:
- id: schema.org/Recipe
  category: domain-standard
  market: food, recipe and grocery content
  conforms: true
  evidence:
    url: https://www.sidechef.com/recipes/249035/classic_quiche_lorraine/
    http_status: 200
    location: >-
      <script type="application/ld+json"> block in the page head
    detail: >-
      JSON-LD object with "@context":"https://schema.org/" and "@type":"Recipe", carrying
      name, description, author, datePublished, image, keywords, nutrition,
      recipeCategory, recipeCuisine, recipeIngredient, recipeInstructions, recipeYield and
      totalTime.
    scope: >-
      Emitted on recipe detail pages across the catalog, which is the surface SideChef
      licenses to partners. This is the machine-readable contract SideChef actually
      publishes at scale.
  deviations:
  - >-
      The object emits both recipeIngredient and a legacy `ingredients` property. The
      `ingredients` property was superseded by recipeIngredient in schema.org and is
      retained here for older consumers.
  - >-
      No aggregateRating, review, cookTime, prepTime or recipeYield-as-QuantitativeValue,
      so the markup is valid but not maximal against Google's recipe rich-result guidance.
